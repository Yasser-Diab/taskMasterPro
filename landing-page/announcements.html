<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>DayVector feature announcements</title>
  </head>
  <body>
    <!--
      Editorial control file for the in-page feature announcement.

      Add one template for each launch. The website displays only the newest
      currently active item, so adding a later publishedAt automatically replaces
      the previous badge. expiresAt is required and must be an ISO-8601 UTC date.
      target is the related section ID on the landing page.
    -->
    <template
      data-dayvector-announcement
      data-id="polish-language-0-0-30"
      data-published-at="2026-09-05T00:00:00.000Z"
      data-expires-at="2027-03-05T00:00:00.000Z"
      data-target="#polish-language"
      data-icon="translate"
    >Polish Language Now Available!</template>
  </body>
</html>
