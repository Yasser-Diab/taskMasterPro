<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your TaskMaster Pro verification code</title>
  </head>
  <body style="margin:0;background:#07111f;color:#e7eef9;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07111f;padding:28px 12px"><tr><td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111d2c;border:1px solid #26364a;border-radius:22px"><tr><td style="padding:32px">
        <div style="color:#93c5fd;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">TaskMaster Pro</div>
        <h1 style="margin:18px 0 10px;font-size:30px;line-height:1.2;color:#ffffff">Verify it is you</h1>
        <p style="margin:0 0 20px;color:#bac7d8;font-size:16px;line-height:1.65">Enter this one-time code in TaskMaster Pro to continue:</p>
        <div style="display:inline-block;background:#07111f;border:1px solid #36516f;border-radius:14px;padding:16px 22px;color:#ffffff;font-size:30px;font-weight:800;letter-spacing:.18em">{{ .Token }}</div>
        <p style="margin:28px 0 0;color:#74869c;font-size:12px;line-height:1.55">The code expires shortly. If you did not request it, ignore this message and do not share the code.</p>
      </td></tr></table>
    </td></tr></table>
  </body>
</html>
