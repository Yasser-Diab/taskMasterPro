name: taskmaster_pro
description: Local-first execution, roadmap, and evidence-based coaching for Windows and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  drift: 2.34.2
  drift_flutter: 0.3.1
  supabase_flutter: 2.16.0
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.1
  uuid: 4.6.0
  intl: 0.20.2
  flutter_local_notifications: 22.2.0
  audioplayers: 6.8.1
  connectivity_plus: 7.3.1
  collection: 1.19.1
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.34.0
  build_runner: 2.15.1
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  assets:
    - media/app-logo/
    - media/notifications-sound/
