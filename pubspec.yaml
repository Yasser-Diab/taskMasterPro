name: taskmaster_pro
description: Local-first execution, roadmap, and evidence-based coaching for Windows and Android.
publish_to: none
version: 0.0.25+25

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  drift: 2.34.2
