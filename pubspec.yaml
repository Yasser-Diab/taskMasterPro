name: taskmaster_pro
description: Local-first execution, roadmap, and evidence-based coaching for Windows and Android.
publish_to: none
version: 0.0.29+56

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.3.2
  go_router: 17.3.0
  drift: 2.34.2
  drift_flutter: 0.3.1
  supabase_flutter: 2.16.0
  app_links: 7.2.1
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.1
  uuid: 4.6.0
  intl: 0.20.2
  flutter_local_notifications: 22.2.0
  audioplayers: 6.8.1
  connectivity_plus: 7.3.1
  collection: 1.19.1
  timezone: 0.11.1
  flutter_timezone: 5.1.0
  package_info_plus: 9.0.1
  http: 1.6.0
  path_provider: 2.1.6
  path: 1.9.1
  file_picker: 10.3.10
  table_calendar: 3.2.0
  health: 13.3.1
  permission_handler: 12.0.3
  webview_flutter: 4.14.1
  webview_flutter_windows: 1.1.1
  pdfrx: 2.4.7
  open_filex: 4.7.0
  crypto: 3.0.7
  cryptography: 2.9.0
  url_launcher: 6.3.2
  image: 4.9.1
  image_picker: 1.2.3
  pdf: 3.13.0
  printing: 5.15.0
  local_auth: 3.0.2
  window_manager: 0.5.2
  flutter_markdown_plus: 1.0.12
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.34.0
  build_runner: 2.15.1
  mocktail: 1.0.5

dependency_overrides:
  # AlarmManager can deliver a cancelled PendingIntent on vendor Android
  # builds. The upstream receiver posts before Dart can validate interval
  # identity, so the audited Android receiver patch suppresses stale execution
  # cards at delivery time using DayVector's local per-device ledger.
  flutter_local_notifications:
    path: third_party/flutter_local_notifications
  # The upstream Windows FFI implementation lets WinRT scheduling exceptions
  # cross the native boundary and terminate the process. Keep the small,
  # audited patch in-repo until the upstream package handles those failures.
  flutter_local_notifications_windows:
    path: third_party/flutter_local_notifications_windows
  # The upstream Windows plugin keeps a Geolocator and PositionChanged
  # subscription alive for the entire process even when the app never asks
  # for location. That leaves Windows showing a permanent location-in-use
  # indicator. This audited fork creates a Geolocator only for an explicit
  # service-status check and releases it immediately afterwards.
  permission_handler_windows:
    path: third_party/permission_handler_windows
  # Public Windows metadata is now DayVector, but existing preferences,
  # avatars, browser profiles, and encrypted vault files must remain in the
  # established compatibility namespace after an in-place upgrade.
  path_provider_windows:
    path: third_party/path_provider_windows
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows

flutter:
  uses-material-design: true
  assets:
    - media/app-logo/
    - media/notifications-sound/
    - assets/release_notes/
    - assets/fonts/
    - assets/illustrations/
    - assets/illustrations/coach/
