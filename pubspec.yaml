name: personal_task_manager
description: A private Windows and Android task, Pomodoro, roadmap, and life-balance manager.
publish_to: none
version: 0.1.2+3

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.19.1
  intl: ^0.20.2
  supabase: ^2.14.0
  uuid: ^4.5.1
  image: ^4.9.1
  timezone: ^0.11.1
dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - media/app-logo/TaskMaster_Pro_Black_Gold_Transparent_main-logo.png
    - media/app-logo/TaskMaster_Pro_Blue_Dark_Transparent.png
    - media/app-logo/TaskMaster_Pro_Light_Transparent.png
    - media/notifications-sound/alert-sound.mp3
    - media/notifications-sound/app-alarm.mp3
    - media/notifications-sound/app-notifications.mp3
    - media/notifications-sound/click-sound.mp3
    - media/notifications-sound/done-sound.mp3
    - media/notifications-sound/notifications.mp3
    - media/notifications-sound/UI-notification-tone.mp3
